<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPSA Trainer</title>
<style>
:root{
  --bg:#0f1419; --bg2:#161c24; --card:#1b232e; --card2:#212c39; --line:#2c3845;
  --tx:#e6edf3; --tx2:#9fb0c0; --tx3:#6b7d8f;
  --ac:#4ea1ff; --ac2:#2b6fc2;
  --ok:#3fb950; --okbg:#10331a; --bad:#f85149; --badbg:#3a1416; --warn:#d29922;
  --r:12px; --sh:0 2px 10px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f6fa; --bg2:#fff; --card:#fff; --card2:#f5f8fc; --line:#dde5ee;
    --tx:#1a2330; --tx2:#52637a; --tx3:#8595a8; --ac:#1f6feb; --ac2:#1456c0;
    --ok:#1a7f37; --okbg:#dcffe4; --bad:#cf222e; --badbg:#ffebe9; --warn:#9a6700; --sh:0 1px 6px rgba(20,40,70,.08);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}
header{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.hb{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:1px solid transparent;color:var(--tx2);padding:6px 12px;border-radius:8px;
  cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
nav button:hover{color:var(--tx);background:var(--card)}
nav button.on{color:#fff;background:var(--ac);border-color:var(--ac)}
@media (prefers-color-scheme: light){nav button.on{color:#fff}}
h1{font-size:26px;margin:24px 0 4px}
h2{font-size:19px;margin:26px 0 12px}
.sub{color:var(--tx2);margin:0 0 18px}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.click{cursor:pointer;transition:.12s}
.card.click:hover{border-color:var(--ac);transform:translateY(-2px)}
.kpi{font-size:30px;font-weight:800;line-height:1.1}
.kpi small{font-size:14px;color:var(--tx2);font-weight:600}
.lbl{color:var(--tx2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.btn{background:var(--ac);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit}
.btn:hover{background:var(--ac2)}
.btn.lg{padding:15px 26px;font-size:16px;width:100%}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.gh:hover{border-color:var(--ac);color:var(--ac)}
.btn.sm{padding:8px 14px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.bar{height:9px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:6px}
.muted{color:var(--tx2)}
.small{font-size:13px}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;cursor:pointer;transition:.12s}
.trow:hover{border-color:var(--ac)}
.trow .tn{font-weight:700}
.trow .tmeta{font-size:12px;color:var(--tx2)}
.trow .pct{font-weight:800;font-size:16px;min-width:48px;text-align:right}
.trow .barwrap{grid-column:1/3}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 6px;flex-wrap:wrap}
.q-prog{font-size:13px;color:var(--tx2);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--warn);border-color:var(--warn)}
.timer.danger{color:var(--bad);border-color:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.qtext{font-size:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin:6px 0 18px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:10px;padding:13px 15px;cursor:pointer;font-family:inherit;font-size:15.5px;color:var(--tx);transition:.1s;width:100%;white-space:pre-wrap;word-break:break-word}
.opt:hover{border-color:var(--ac)}
.opt .key{flex:0 0 26px;height:26px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--tx2)}
.opt.sel{border-color:var(--ac);background:rgba(78,161,255,.10)}
.opt.sel .key{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.lock{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:3px solid var(--ac);background:var(--card2);font-size:14.5px}
.expl .et{font-weight:800;color:var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.qbar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.fb{font-weight:800;font-size:15px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:14px}
.pn{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);font-weight:700;
  font-size:12px;cursor:pointer;font-family:inherit}
.pn.ans{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.pn.cur{outline:2px solid var(--ac);outline-offset:1px}
.pn.flag{background:var(--warn);color:#1a2330;border-color:var(--warn)}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:30px}
.flash .ft{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);margin-bottom:12px}
.flash .fq{font-size:19px;font-weight:700;white-space:pre-wrap}
.flash .fa{font-size:17px;color:var(--ok);font-weight:700;white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--card);border:none;color:var(--tx2);padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
.seg button.on{background:var(--ac);color:#fff}
.banner{padding:14px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--line);margin:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;
  border-radius:10px;font-weight:700;font-size:14px;box-shadow:var(--sh);opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--tx2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.split{grid-template-columns:1fr}.qtext{font-size:16.5px}}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--ac) calc(var(--p)*1%), var(--card2) 0);}
.ring .in{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.foot{color:var(--tx3);font-size:12px;text-align:center;margin-top:30px}

.qtext,.fq,summary{white-space:pre-wrap;overflow-wrap:anywhere}
summary{cursor:pointer;font-weight:650;line-height:1.6}
details[open] summary{margin-bottom:10px}
input[type=search],select{max-width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
input[type=search]{width:300px}label{font-size:14px}
.pitfall{border-left:3px solid var(--warn)}
.opt:focus-visible,.btn:focus-visible,summary:focus-visible,nav button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
@media(max-width:600px){.hb{gap:8px}nav{margin-left:0}.qtext{font-size:18px}input[type=search]{width:100%}.card.row>label{width:100%}}
/* Keep the navigation compact and the main study controls within thumb reach. */
:root{color-scheme:dark light;--header-offset:120px}
.hb{max-width:1100px;display:grid;grid-template-columns:auto minmax(0,1fr)}
.mobile-mode{display:none}
nav{flex-wrap:nowrap;overflow-x:auto;min-width:0;max-width:100%;scrollbar-width:thin;overscroll-behavior-inline:contain}
nav button{white-space:nowrap;min-height:44px;padding:8px 12px}
.wrap{max-width:960px}
.btn,.seg button,select{min-height:44px}
button,.brand,.card.click,.trow[onclick],summary{touch-action:manipulation}
.trow[onclick]:focus-visible,.card.click:focus-visible,.brand:focus-visible,.flash:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.qtext:focus,h1:focus{outline:none}
.qcard,.card,.trow{min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.inline-actions{display:none!important}
.session-dock{position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(960px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg2);border:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -3px 15px rgba(0,0,0,.08)}
.has-session .wrap{padding-bottom:150px}
.session-dock .btn{flex-shrink:0}
.session-dock .muted{max-width:55%;line-height:1.35}
.exam-map{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.exam-map>summary{font-size:14px;padding:8px 0;min-height:44px}
.map-tools{margin-top:12px}
.palette{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:300px;overflow:auto;padding:4px}
.pn{min-height:44px;aspect-ratio:auto;font-size:12px}
.flash{padding:24px 10px}
.flash .expl{text-align:left}
.resume-card{margin:16px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-left:4px solid var(--ac)}
.revision-note{margin:14px 0;font-size:14px}
.revision-note>summary{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#bankRows{scroll-margin-top:var(--header-offset)}
input[type=search],select{font-size:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){
  .hb{grid-template-columns:minmax(0,1fr) minmax(130px,170px);gap:6px;padding:6px 12px}
  .brand{font-size:16px;min-height:32px;justify-self:start}
  nav{display:none}
  .mobile-mode{display:block;width:100%;min-width:0;font-size:14px}
  nav::-webkit-scrollbar{display:none}
  nav button{font-size:13px;padding:8px 12px}
  .wrap{padding:0 12px 64px}
  h1{font-size:24px;margin-top:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cards .card{padding:14px;min-height:120px}
  .cards .lbl{font-size:11px}
  .cards .small{font-size:12px}
  .cards .ring{width:88px;height:88px;margin:auto}
  .cards .ring .in{width:68px;height:68px}
  .cards .ring .in>div>div:first-child{font-size:12px!important}
  .cards .ring .small{font-size:10px}
  .qcard{padding:16px}
  .qtext{font-size:18px;line-height:1.55}
  .opt{font-size:16px;padding:12px;gap:10px}
  .session-dock{gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .session-dock .btn{font-size:14px;padding:10px 12px}
  .session-dock .muted{font-size:12px;max-width:48%}
  .exam-map .palette{max-height:250px}
  .toast{bottom:90px;max-width:calc(100% - 24px);width:max-content;text-align:center}
  .flash{min-height:200px;padding:20px 4px}
  .flash .fq{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

</style>
</head>
<body>
<header>
  <div class="hb">
    <div class="brand" onclick="go('home')"><span class="dot"></span>CPSA&nbsp;Trainer</div>
    <nav id="nav" aria-label="Study modes"></nav><select id="modeSwitcher" class="mobile-mode" aria-label="Study mode" onchange="go(this.value)"></select>
  </div>
</header>
<div class="wrap"><main id="app"></main>
  <div class="foot">Offline study tool · progress saved in this browser · aligned to CREST CPSA syllabus v2.5</div>
</div>
<div class="toast" id="toast" role="status"></div><div id="ui-status" class="sr-only" role="status" aria-live="polite"></div>
<script>
const BANK = [
  {
    "id": 0,
    "c": "D",
    "s": "D4",
    "q": "A legacy IKEv1 responder selects a different pre-shared key for each peer IP. Why is Main Mode awkward for roaming clients whose IPs change?",
    "a": "It must select the PSK before decrypting the peer identity",
    "d": [
      "Main Mode does not support pre-shared keys",
      "Main Mode sends the peer identity before key selection",
      "XAUTH requires the responder to disable encryption"
    ],
    "e": "This is a key-selection constraint in the stated configuration, not a universal ban on Main Mode for remote access. Shared group keys or other authentication designs change the constraint.",
    "p": "Do not turn an implementation constraint into a protocol prohibition.",
    "level": "challenge",
    "refs": [
      "ike"
    ]
  },
  {
    "id": 1,
    "q": "What is the block size of the DES encryption cipher?",
    "a": "64 bits",
    "d": [
      "40 bits",
      "128 bits",
      "56 bits",
      "112 bits"
    ],
    "c": "B",
    "s": "",
    "e": "DES uses a 64-bit block size; its key is 56 effective bits.",
    "level": "foundation"
  },
  {
    "id": 2,
    "q": "What is this: 16:23:57.094021 IP 192.168.124.204.137 > 192.168.124.255.137: NBT UDP PACKET(137): QUERY; REQUEST; BROADCAST",
    "a": "A NetBIOS over TCP/IP name service broadcast",
    "d": [
      "A Spanning Tree Protocol broadcast",
      "An ARP broadcast",
      "A NetBIOS over TCP/IP session service broadcast",
      "A CDP broadcast"
    ],
    "c": "D",
    "s": "",
    "e": "A UDP packet to/from port 137 at the broadcast address is a NetBIOS over TCP/IP name-service broadcast.",
    "level": "foundation"
  },
  {
    "id": 3,
    "c": "B",
    "s": "B11",
    "q": "Which symmetric cipher below has a 56-bit effective key and is unsuitable for modern confidentiality?",
    "a": "DES",
    "d": [
      "Two-key 3DES",
      "AES-128",
      "AES-256"
    ],
    "e": "DES has 56 effective key bits. AES-128 and AES-256 have the stated key sizes; two-key 3DES is also legacy, but does not have a 56-bit effective key.",
    "p": "Compare ciphers with ciphers, not with hash functions.",
    "level": "challenge",
    "refs": [
      "des"
    ]
  },
  {
    "id": 4,
    "q": "Which file in a user's home directory controls the trust relationships for Berkeley R services?",
    "a": ".rhosts",
    "d": [
      "hosts.equiv",
      "rhosts",
      "rhosts.allow",
      "hosts.allow"
    ],
    "c": "F",
    "s": "",
    "e": ".rhosts in a user's home directory defines trusted hosts and users for the Berkeley r-services, easily abused if misconfigured.",
    "level": "foundation"
  },
  {
    "id": 6,
    "q": "Which of the following algorithms could be used to negotiate a shared encryption key?",
    "a": "Diffie-Hellman",
    "d": [
      "Triple-DES",
      "SHA1",
      "DES",
      "AES"
    ],
    "c": "B",
    "s": "",
    "e": "Diffie-Hellman lets two parties negotiate a shared encryption key over an insecure channel.",
    "level": "foundation"
  },
  {
    "id": 7,
    "c": "I",
    "s": "I2",
    "q": "Input containing <script>alert('test')<\/script> appears in an HTML response as &lt;script&gt;alert('test')&lt;/script&gt;. No script executes. What is established?",
    "a": "Reflection without demonstrated script execution",
    "d": [
      "Reflected XSS is confirmed because the payload appears",
      "Stored XSS is confirmed because the response contains HTML",
      "DOM XSS is confirmed because JavaScript was submitted"
    ],
    "e": "The observed HTML entities are rendered as text in this context. Reflection alone is not execution. Test the actual output context; stored and DOM XSS require additional evidence.",
    "p": "A reflected payload is not automatically a vulnerability.",
    "level": "challenge",
    "refs": [
      "xss"
    ]
  },
  {
    "id": 8,
    "q": "Which protocols are associated with PPTP?",
    "a": "TCP port 1723 and IP protocol 47",
    "d": [
      "IP protocol 89",
      "IP protocol 94",
      "TCP port 443",
      "UDP port 500, IP protocol 50 and IP protocol 51"
    ],
    "c": "B",
    "s": "",
    "e": "PPTP uses TCP 1723 for control and IP protocol 47 (GRE) for the tunnel.",
    "level": "foundation"
  },
  {
    "id": 9,
    "c": "F",
    "s": "F2",
    "q": "What does a password field in /etc/shadow normally store on a shadow-password Unix system?",
    "a": "A password hash or authentication-status marker",
    "d": [
      "A reversible encrypted plaintext password in every case",
      "The public key used for all logins",
      "The UID and GID of each account"
    ],
    "e": "Shadow password fields can contain hashes or markers such as locked-account values. They are not generally reversible encryption; UID/GID fields belong in passwd.",
    "p": "Passwords are hashed, not simply 'encrypted'.",
    "level": "foundation",
    "refs": [
      "unix"
    ]
  },
  {
    "id": 10,
    "q": "Which of the following statements about the rwho protocol is true?",
    "a": "The rwho daemon sends regular broadcasts to UDP port 513, and listens to broadcasts from other systems.",
    "d": [
      "rwho clients can query the rwho daemon. The protocol uses ONC/RPC.",
      "rwho clients can query the rwho daemon using UDP port 513.",
      "rwho clients can query the rwho daemon using TCP port 513.",
      "The rwho daemon sends regular broadcasts to TCP port 513, and listens to broadcasts from other systems."
    ],
    "c": "B",
    "s": "",
    "e": "The rwho daemon broadcasts to UDP 513 and listens for others, leaking which users are logged in.",
    "level": "foundation"
  },
  {
    "id": 11,
    "c": "E",
    "s": "E1",
    "q": "Which Windows command attempts an anonymous SMB connection to IPC$ using empty credentials?",
    "a": "net use \\\\host\\IPC$ \"\" /user:\"\"",
    "d": [
      "net use \\\\host\\IPC$ \"NULL\" /user:\"NULL\"",
      "net use \\\\host\\C$ \"\" /user:\"Administrator\"",
      "net use \\\\host\\IPC$ \"guest\" /user:\"guest\""
    ],
    "e": "Empty credentials request an anonymous session; literal NULL is a string, and guest is a different principal. Server policy determines whether the attempt works and what is accessible.",
    "p": "A command attempts a null session; it does not guarantee enumeration.",
    "level": "challenge",
    "refs": [
      "ad"
    ]
  },
  {
    "id": 12,
    "c": "E",
    "s": "E4",
    "q": "Why is an old Windows Server 2003 Administrator lockout rule unsafe to apply blindly to a current Windows system?",
    "a": "Lockout behavior depends on version and the effective policy",
    "d": [
      "Renaming Administrator always removes its RID",
      "Every current Administrator account is permanently unlocked",
      "Every account with RID 500 must use a blank password"
    ],
    "e": "The historical built-in-account exemption is version-specific. Verify the current policy and build rather than assuming legacy behavior, especially when planning online guessing.",
    "p": "Legacy behavior must carry its version and policy context.",
    "level": "challenge",
    "refs": [
      "crest"
    ]
  },
  {
    "id": 13,
    "c": "B",
    "s": "B13",
    "q": "A program requests mode 0666 for a new regular file and the process umask is 0027. What mode results before other controls?",
    "a": "0640",
    "d": [
      "0650",
      "0666",
      "0627"
    ],
    "e": "Apply the mask as bit removal: 0666 & ~0027 = 0640. A mask cannot add execute bits missing from the requested mode. Default ACLs can change the wider creation rules.",
    "p": "umask is bitwise removal, not ordinary subtraction.",
    "level": "challenge",
    "refs": [
      "unix"
    ]
  },
  {
    "id": 15,

function validProgress(d){
  if(!d||typeof d!=='object'||!d.stats||typeof d.stats!=='object'||Array.isArray(d.stats))return false;
  if(d.exams!=null&&!Array.isArray(d.exams))return false;
  for(const [id,s] of Object.entries(d.stats)){
    if(!/^\d+$/.test(id)||!s||!['n','c','w','box','last'].every(k=>Number.isFinite(s[k])&&s[k]>=0))return false;
    if(!Number.isInteger(s.n)||!Number.isInteger(s.c)||!Number.isInteger(s.w)||s.c>s.n||s.w>s.n||s.c+s.w!==s.n||s.box>4)return false;
  }
  for(const e of d.exams||[])if(!e||!['score','total','dur','date'].every(k=>Number.isFinite(e[k])&&e[k]>=0)||e.total<1||e.score>e.total)return false;
  if(d.flashStats!=null&&(typeof d.flashStats!=='object'||Array.isArray(d.flashStats)))return false;
  for(const [id,s] of Object.entries(d.flashStats||{}))if(!/^\d+$/.test(id)||!s||!['n','c','last'].every(k=>Number.isFinite(s[k])&&s[k]>=0)||s.c>s.n)return false;
  return true;
}
function migrate(d){

}

function pickWeighted(pool,n){const list=pool.map(q=>[q,weight(q)]);const out=[];
  let tot=list.reduce((a,b)=>a+b[1],0);

  for(let k=0;k<n&&arr.length;k++){let r=Math.random()*tot,i=0;while(i<arr.length-1&&(r-=arr[i][1])>0)i++;
    out.push(arr[i][0]);tot-=arr[i][1];arr.splice(i,1);}
  return out;}

function catStats(){const m={};CATS.forEach(c=>m[c]={tot:0,seen:0,n:0,c:0});

  CATS.forEach(c=>{m[c].acc=m[c].n?m[c].c/m[c].n:null;m[c].cov=m[c].tot?m[c].seen/m[c].tot:0;});
  return m;}

function examReady(cs){const cats=CATS.filter(c=>c!=='K');let scored=0,good=0,covOk=0;
  cats.forEach(c=>{if(cs[c].acc!=null){scored++;if(cs[c].acc>=0.7)good++;}if(cs[c].cov>=0.5)covOk++;});

  const pct=Math.round((o.acc*0.6+ (good/cats.length)*0.25 + (covOk/cats.length)*0.15)*100);
  let label='Keep going',col='var(--warn)';
  if(pct>=75){label='Strong practice';col='var(--ok)';}else if(pct<50){label='Needs work';col='var(--bad)';}
  return{pct,label,col};}

function buildExam(){
  const pool=inScope(),byc={};pool.forEach(q=>(byc[q.c]=byc[q.c]||[]).push(q));
  const N=Math.min(EXAM_N,pool.length),cats=shuffle(Object.keys(byc));
  const groups=cats.map(c=>shuffle(byc[c])),picks=[];
  while(picks.length<N&&groups.some(g=>g.length))for(const group of groups){if(picks.length<N&&group.length)picks.push(group.pop());}
  return shuffle(picks).map(q=>({id:q.id,opts:shuffle([q.a,...q.d]),ans:null,flag:false}));
}

  if(left<=0){stopTimer();submitExam(true);}},1000);}

function fmt(s){s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;

function examRun(){

  h+=`<div class="qcard"><div class="row" style="justify-content:space-between"><span class="chip" style="background:${catColor(q.c)}22;color:${catColor(q.c)};border-color:${catColor(q.c)}55">${q.c} · ${esc(catName(q.c))}</span>
    <button class="btn gh sm" onclick="flagQ()">${it.flag?'★ Flagged':'☆ Flag'}</button></div>
    <div class="qtext">${esc(q.q)}</div><div class="opts">`;
  it.opts.forEach((o,i)=>{h+=`<button class="opt ${it.ans===o?'sel':''}" onclick="examPick(${i})"><span class="key">${i+1}</span><span>${esc(o)}</span></button>`;});
  h+=`</div><div class="qbar"><button class="btn gh" onclick="examNav(-1)">← Prev</button>
    <button class="btn gh" onclick="examNav(1)">Next →</button>
    <button class="btn" style="margin-left:auto" onclick="confirmSubmit()">Submit exam</button></div>`;
  h+=`<div class="palette">`+sess.items.map((i,n)=>`<button class="pn ${i.ans!=null?'ans':''} ${i.flag?'flag':''} ${n===sess.idx?'cur':''}" onclick="examGo(${n})">${n+1}</button>`).join('')+`</div>`;
  h+=`</div>`;
  $('#app').innerHTML=h;
  const el=$('#timer'),left=Math.round((sess.end-Date.now())/1000);if(el)el.textContent=fmt(left);
}
function examPick(i){sess.items[sess.idx].ans=sess.items[sess.idx].opts[i];examRun();}
function examNav(d){sess.idx=Math.max(0,Math.min(sess.items.length-1,sess.idx+d));examRun();}
function examGo(n){sess.idx=n;examRun();}
function flagQ(){sess.items[sess.idx].flag=!sess.items[sess.idx].flag;examRun();}
function confirmSubmit(){const un=sess.items.filter(i=>i.ans==null).length;
  if(confirm(un?`${un} question(s) unanswered. Submit anyway?`:'Submit exam and see results?'))submitExam(false);}
function submitExam(auto){if(!sess||!sess.live)return;stopTimer();let correct=0;
  sess.items.forEach(it=>{const q=byId(it.id);const ok=it.ans===q.a;record(it.id,ok);if(ok)correct++;});
  const dur=Math.round((Date.now()-sess.start)/1000);
  S.exams.push({date:Date.now(),score:correct,total:sess.items.length,dur,auto:!!auto});save();
  const res=sess.items;sess.live=false;examResults(correct,res,dur,auto);}
function examResults(correct,items,dur,auto){
  const total=items.length,pct=Math.round(correct/total*100),pass=correct/total>=PASS;
  const byc={};items.forEach(it=>{const q=byId(it.id);byc[q.c]=byc[q.c]||{n:0,c:0};byc[q.c].n++;if(it.ans===q.a)byc[q.c].c++;});
  let h=`<h1>Exam ${pass?'passed ✓':'result'}</h1>${auto?'<div class="banner">⏱ Time expired — exam auto-submitted.</div>':''}`;

    <div class="ring" style="--p:${pct};--ac:${pass?'var(--ok)':'var(--bad)'}"><div class="in"><div><div style="font-size:26px;font-weight:800;color:${pass?'var(--ok)':'var(--bad)'}">${pct}%</div><div class="small muted">${correct}/${total}</div></div></div></div>
    <div><div style="font-size:20px;font-weight:800;color:${pass?'var(--ok)':'var(--bad)'}">${pass?'PASS':'BELOW PASS'} <span class="small muted">(60% needed)</span></div>
    <div class="small muted">Time: ${fmt(dur)} · ${new Date().toLocaleString()}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="startExam()">Retake</button><button class="btn gh" onclick="reviewExam()">Review answers</button><button class="btn gh" onclick="go('home')">Dashboard</button></div></div></div>`;
  h+=`<h2>By syllabus area</h2><div class="tlist">`;
  Object.keys(byc).sort((a,b)=>byc[a].c/byc[a].n-byc[b].c/byc[b].n).forEach(c=>{const m=byc[c],p=Math.round(m.c/m.n*100);

      <div class="pct" style="color:${accColor(m.c/m.n)}">${p}%</div><div class="barwrap"><div class="bar"><i style="width:${p}%;background:${accColor(m.c/m.n)}"></i></div></div></div>`;});
  h+=`</div>`;
  sess._review=items;$('#app').innerHTML=h;
}

function explanation(q){
  let h=`<div class="expl"><div class="et">Why this answer</div>${esc(q.e)}</div>`;
  if(q.p)h+=`<div class="expl pitfall"><div class="et">Common pitfall</div>${esc(q.p)}</div>`;
  if(q.refs&&q.refs.length)h+=`<div class="small muted" style="margin-top:10px">${q.s?`Skill ${esc(q.s)} · `:''}Further reading: ${q.refs.filter(k=>REFERENCES[k]).map(k=>`<a href="${REFERENCES[k][1]}" target="_blank" rel="noopener noreferrer">${esc(REFERENCES[k][0])}</a>`).join(' · ')}</div>`;
  return h;
}
let bankQuery='',bankCat='ALL',bankLevel='ALL',bankPage=0;
function bankView(){
  let h=`<h1>Question bank</h1><p class="sub">Search ${BANK.length} questions. Think through your answer, then expand to compare the explanation and pitfall. This browser does not record a score.</p>`;
  h+=`<div class="card row"><label>Search <input id="bankSearch" type="search" placeholder="Topic, command, or misconception" oninput="bankQuery=this.value;bankPage=0;renderBankRows()"></label><label>Group <select onchange="bankCat=this.value;bankPage=0;renderBankRows()"><option value="ALL">All A–J</option>${CATS.map(c=>`<option value="${c}" ${bankCat===c?'selected':''}>${c} · ${esc(catName(c))}</option>`).join('')}</select></label><label>Practice <select onchange="bankLevel=this.value;bankPage=0;renderBankRows()"><option value="ALL">All</option><option value="foundation" ${bankLevel==='foundation'?'selected':''}>Foundations</option><option value="challenge" ${bankLevel==='challenge'?'selected':''}>Applied &amp; pitfalls</option></select></label></div><div id="bankRows" style="margin-top:16px"></div>`;

}
function renderBankRows(){
  const query=bankQuery.toLowerCase().trim();
  const matches=BANK.filter(q=>(bankCat==='ALL'||q.c===bankCat)&&(bankLevel==='ALL'||q.level===bankLevel)&&(!query||[q.q,q.a,q.e,q.p,q.s,catName(q.c)].join(' ').toLowerCase().includes(query)));
  const size=20,pages=Math.max(1,Math.ceil(matches.length/size));bankPage=Math.min(bankPage,pages-1);
  let h=`<p class="small muted" aria-live="polite">${matches.length} matches · page ${bankPage+1}/${pages}</p>`;
  h+=matches.slice(bankPage*size,(bankPage+1)*size).map(q=>`<details class="qcard" style="margin-bottom:12px"><summary><span class="chip">${q.c} · #${q.id}</span> ${esc(q.q)}</summary><div class="opts" style="margin-top:14px">${bankOptions(q).map(o=>`<div class="opt lock"><span>${esc(o)}</span></div>`).join('')}</div><div class="expl"><div class="et">Answer</div>${esc(q.a)}</div>${explanation(q)}</details>`).join('');
  if(!matches.length)h+='<div class="banner">No matching questions. Try a broader term or another group.</div>';
  h+=`<div class="row"><button class="btn gh" ${bankPage===0?'disabled':''} onclick="bankPageStep(-1);">Previous</button><button class="btn gh" ${bankPage>=pages-1?'disabled':''} onclick="bankPageStep(1);">Next</button></div>`;
  $('#bankRows').innerHTML=h;
}

function reviewExam(){const items=sess._review;let h=`<h1>Answer review</h1><p class="sub">${items.filter(i=>byId(i.id).a!==i.ans).length} incorrect / ${items.length}</p>
  <div class="row" style="margin-bottom:14px"><button class="btn gh" onclick="examResultsBack()">← Back to result</button></div>`;
  items.forEach((it,n)=>{const q=byId(it.id),ok=it.ans===q.a;
    h+=`<div class="qcard" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span class="chip" style="background:${catColor(q.c)}22;color:${catColor(q.c)};border-color:${catColor(q.c)}55">${q.c}</span><span class="fb ${ok?'ok':'bad'}">${ok?'✓ Correct':(it.ans==null?'— Unanswered':'✗ Incorrect')}</span></div>
      <div class="qtext" style="font-size:16px">${n+1}. ${esc(q.q)}</div>
      <div class="opts">`+[q.a,...q.d].sort().map(o=>{let cl='';if(o===q.a)cl='correct';else if(o===it.ans)cl='wrong';

    h+=explanation(q);
    h+=`</div>`;});
  $('#app').innerHTML=h;window.scrollTo(0,0);}
function examResultsBack(){const items=sess._review;let correct=items.filter(i=>byId(i.id).a===i.ans).length;
  examResults(correct,items,S.exams[S.exams.length-1].dur,false);window.scrollTo(0,0);}

function makeSession(mode,pool,len,title){
  if(!pool.length){toast("No questions match this practice filter");return;}
  const items=pickWeighted(pool,Math.min(len,pool.length)).map(q=>({id:q.id,opts:shuffle([q.a,...q.d]),ans:null,done:false,flip:false}));
  sess={mode,live:true,items,idx:0,title,right:0,len};
  if(mode==='flash')flashRun();else drillRun();
}
function drillHome(){

let LEN=20;function setLen(n){LEN=n;document.querySelectorAll('#lenSeg button').forEach(b=>b.classList.toggle('on',+b.textContent===n));}

function weakHome(){

function startWeak(){

    const ca=cs[q.c].acc; if(ca!=null&&ca<0.75)w*=(1+(0.75-ca)*2);

function flashStart(c){const pool=practicePool(c==='ALL'?inScope():BANK.filter(q=>q.c===c));if(!pool.length){toast('No questions');return;}makeSession('flash',pool,LEN,c==='ALL'?'All areas':catName(c));}
function flashRun(){
  const it=sess.items[sess.idx],q=byId(it.id);
  let h=`<div class="q-top"><div class="q-prog">${esc(sess.title)} · card ${sess.idx+1}/${sess.items.length}</div><button class="btn gh sm" onclick="go('flash')">Pause</button></div>`;
  h+=`<div class="qcard"><div class="row"><span class="chip" style="background:${catColor(q.c)}22;color:${catColor(q.c)};border-color:${catColor(q.c)}55">${q.c} · ${esc(catName(q.c))}</span></div>
    <div class="flash" onclick="flashFlip()"><div class="ft">${it.flip?'Answer':'Question — tap to reveal'}</div>`;
  if(!it.flip)h+=`<div class="fq">${esc(q.q)}</div>`;
  else{h+=`<div class="fq" style="font-size:16px;margin-bottom:14px">${esc(q.q)}</div><div class="fa">${esc(q.a)}</div>`;h+=explanation(q);}
  h+=`</div>`;

  else h+=`<div class="qbar"><button class="btn" style="width:100%" onclick="flashFlip()">Reveal answer</button></div>`;
  h+=`</div><p class="small muted" style="margin-top:10px"><span class="kbd">Space</span> flip · <span class="kbd">←</span> didn't know · <span class="kbd">→</span> knew it</p>`;

}
function flashFlip(){sess.items[sess.idx].flip=!sess.items[sess.idx].flip;flashRun();}
function flashRate(ok){
  const it=sess.items[sess.idx];if(it.done)return;it.done=true;it.ans=ok?byId(it.id).a:null;
  const s=S.flashStats[it.id]||{n:0,c:0,last:0};s.n++;if(ok)s.c++;s.last=Date.now();S.flashStats[it.id]=s;save();
  if(ok)sess.right++;nextOrEnd();
}

function drillRun(){
  const it=sess.items[sess.idx],q=byId(it.id);
  let h=`<div class="q-top"><div class="q-prog">${esc(sess.title)} · ${sess.idx+1}/${sess.items.length} · score ${sess.right}/${sess.items.filter(i=>i.done).length}</div><button class="btn gh sm" onclick="go('${sess.mode==='weak'?'weak':'drill'}')">Pause</button></div>`;

    <div class="qtext">${esc(q.q)}</div><div class="opts">`;
  it.opts.forEach((o,i)=>{let cl='';if(it.done){if(o===q.a)cl='correct';else if(o===it.ans)cl='wrong';cl+=' lock';}else if(it.ans===o)cl='sel';
    h+=`<button class="opt ${cl}" onclick="drillPick(${i})"><span class="key">${it.done?(o===q.a?'✓':(o===it.ans?'✗':i+1)):i+1}</span><span>${esc(o)}</span></button>`;});
  h+=`</div>`;
  if(it.done){const ok=it.ans===q.a;h+=`<div class="qbar" style="margin-top:14px"><span class="fb ${ok?'ok':'bad'}">${ok?'✓ Correct':'✗ Incorrect'}</span></div>`;
    h+=explanation(q);
    h+=`<div class="qbar"><button class="btn" style="margin-left:auto" onclick="nextOrEnd()">${sess.idx<sess.items.length-1?'Next →':'Finish'}</button></div>`;}
  h+=`</div>`;
  if(!it.done)h+=`<p class="small muted" style="margin-top:10px">Keys <span class="kbd">1</span>–<span class="kbd">${it.opts.length}</span> to answer · <span class="kbd">Enter</span> next</p>`;

function drillPick(i){const it=sess.items[sess.idx];if(it.done)return;it.ans=it.opts[i];it.done=true;

function nextOrEnd(){if(sess.idx<sess.items.length-1){sess.idx++;sess.mode==='flash'?flashRun():drillRun();}else sessionDone();}

    <div class="ring" style="--p:${pct}"><div class="in"><div><div style="font-size:24px;font-weight:800;color:${accColor(right/total)}">${pct}%</div><div class="small muted">${right}/${total}</div></div></div></div>

    h+=`<div class="qcard" style="margin-bottom:10px"><div class="qtext" style="font-size:16px">${esc(q.q)}</div>

  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function retryMistakes(){const mode=sess.mode,pool=sess.items.filter(i=>i.done&&i.ans!==byId(i.id).a).map(i=>byId(i.id));makeSession(mode,pool,pool.length,'Missed items');}
function repeatSession(){const m=sess.mode;if(m==='weak')startWeak();else{const c=sess.title==='All areas'?'ALL':CATS.find(x=>catName(x)===sess.title)||'ALL';

    <button class="btn gh sm" style="border-color:var(--bad);color:var(--bad)" onclick="resetP()">Reset all progress</button></div></div>`;
  h+=`<div class="card" style="margin-top:14px"><b>Syllabus reference (CREST CPSA v2.5)</b><div class="grid" style="margin-top:10px;gap:8px">`;
  CATS.forEach(c=>{if(!SYL[c])return;h+=`<div><span class="chip" style="background:${catColor(c)}22;color:${catColor(c)};border-color:${catColor(c)}55">${c}</span> <b>${esc(SYL[c].name)}</b><div class="small muted">${esc(SYL[c].skills||'')}</div></div>`;});
  h+=`</div></div>`;
  $('#app').innerHTML=h;
}
function exportP(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');
  const url=URL.createObjectURL(b);a.href=url;a.download='cpsa_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function importP(e){const f=e.target.files[0];if(!f)return;
  if(f.size>5*1024*1024){toast('Backup too large');return;}
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!validProgress(d)){toast('Invalid progress backup');return;}
    if(!confirm('Replace current progress with this backup? A copy of current progress will be retained in browser storage.'))return;
    try{localStorage.setItem(KEY+'_before_import',JSON.stringify(S));}catch(x){exportP();}
    S=migrate(d);save();toast('Progress imported');settingsView();
  }catch(x){toast('Invalid progress backup');}};r.readAsText(f);
}
function resetP(){if(confirm('Erase ALL progress, stats and exam history? This cannot be undone.')){S=init();save();toast('Progress reset');go('home');}}



/* Embedded by build_trainer.py: responsive controls and recoverable study sessions. */
const SESSION_KEY=KEY+'_active_session_v1';
const bankOptionCache=new Map();
function bankOptions(q){if(!bankOptionCache.has(q.id))bankOptionCache.set(q.id,shuffle([q.a,...q.d]));return bankOptionCache.get(q.id);}
function announce(message){document.getElementById('ui-status').textContent=message;}
function persistSession(){
  if(!sess||!sess.live)return;
  try{localStorage.setItem(SESSION_KEY,JSON.stringify({bankVersion:BANK_VERSION,session:sess}));}catch(e){storageOK=false;}
}
function clearSavedSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){storageOK=false;}}
function readSavedSession(){
  try{
    const raw=JSON.parse(localStorage.getItem(SESSION_KEY));if(!raw||raw.bankVersion!==BANK_VERSION)return null;
    const s=raw.session;if(!s||!s.live||!['exam','drill','weak','flash'].includes(s.mode)||!Array.isArray(s.items)||!s.items.length||s.items.length>120)return null;
    if(!Number.isInteger(s.idx)||s.idx<0||s.idx>=s.items.length||new Set(s.items.map(i=>i.id)).size!==s.items.length)return null;
    for(const it of s.items){
      const q=byId(it.id);if(!q||!Array.isArray(it.opts)||it.opts.length!==q.d.length+1)return null;
      if(new Set(it.opts).size!==it.opts.length||it.opts.some(o=>![q.a,...q.d].includes(o))||(it.ans!=null&&!it.opts.includes(it.ans)))return null;
      if(it.done!=null&&typeof it.done!=='boolean')return null;
    }
    if(s.mode==='exam'){
      if(!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.end<s.start||s.end-s.start>EXAM_SEC*1000)return null;
    }else{
      if(!Number.isInteger(s.right)||s.right<0||s.right>s.items.filter(i=>i.done).length||!Number.isInteger(s.len)||s.len<1)return null;
      if(typeof s.title!=='string'||s.title.length>120)return null;
    }
    return s;
  }catch(e){return null;}
}
function resumeSession(){
  const saved=readSavedSession();if(!saved){toast('No compatible saved session');dashboard();return;}
  stopTimer();sess=saved;view=sess.mode==='exam'?'exam':sess.mode==='flash'?'flash':sess.mode==='weak'?'weak':'drill';renderNav();
  if(sess.mode==='exam'){if(sess.end<=Date.now()){submitExam(true);return;}startTimer();examRun();}
  else if(sess.mode==='flash')flashRun();else drillRun();
  focusQuestion();announce('Saved session resumed.');
}
function discardSavedSession(){if(confirm('Discard the saved session? Completed drill answers remain in your progress.')){clearSavedSession();dashboard();}}
function focusQuestion(){
  window.scrollTo(0,0);const el=document.querySelector('.qtext,.flash');
  if(el){el.setAttribute('tabindex','-1');el.focus({preventScroll:true});}
}
renderNav=function(){
  const labels={home:'Home',exam:'Mock exam',drill:'Topic drills',weak:'Weak areas',flash:'Flashcards',bank:'Question bank',settings:'Settings'};
  document.getElementById('nav').innerHTML=NAV.map(([key])=>`<button class="${view===key?'on':''}" ${view===key?'aria-current="page"':''} onclick="go('${key}')">${labels[key]}</button>`).join('');
  const switcher=document.getElementById('modeSwitcher');
  switcher.innerHTML=NAV.map(([key])=>`<option value="${key}">${labels[key]}</option>`).join('');switcher.value=view;
  document.querySelector('#nav .on')?.scrollIntoView({block:'nearest',inline:'nearest'});
};
const baseDashboard=dashboard;
dashboard=function(){
  document.body.classList.remove('has-session');baseDashboard();
  const update=[...document.querySelectorAll('#app .banner')].find(el=>el.textContent.startsWith('Revised '));
  if(update){
    const note=[...document.querySelectorAll('#app p')].find(el=>el.textContent.startsWith('Practice scores describe'));
    const details=document.createElement('details');details.className='revision-note';details.innerHTML='<summary>About this question bank and practice scores</summary>';
    update.before(details);details.append(update);if(note)details.append(note);
  }
  const saved=readSavedSession();
  if(saved){
    const title=saved.mode==='exam'?'mock exam':saved.mode==='flash'?'flashcards':'practice';
    const expired=saved.mode==='exam'&&saved.end<=Date.now();
    const banner=document.createElement('section');banner.className='card resume-card';
    banner.innerHTML=`<div><strong>${expired?'Your saved exam timer has ended':`Continue your ${title}`}</strong><div class="small muted">Question ${saved.idx+1} of ${saved.items.length}${saved.mode==='exam'?' · the countdown continues while you are away':''}</div></div><div class="row"><button class="btn" onclick="resumeSession()">${expired?'View timed result':'Resume session'}</button><button class="btn gh" onclick="discardSavedSession()">Discard</button></div>`;
    document.querySelector('#app h1').after(banner);
  }
};
go=function(v){
  if(sess?.live){persistSession();stopTimer();}
  sess=null;view=v;document.body.classList.remove('has-session');renderNav();window.scrollTo(0,0);
  ({home:dashboard,exam:examHome,drill:drillHome,weak:weakHome,flash:flashHome,bank:bankView,settings:settingsView}[v]||dashboard)();
  document.querySelector('#app h1')?.setAttribute('tabindex','-1');document.querySelector('#app h1')?.focus({preventScroll:true});
};
function approveNewSession(){
  if(!readSavedSession())return true;
  return confirm('Start a new session and replace the saved one? Completed drill answers remain saved.');
}
const baseStartExam=startExam;
startExam=function(){if(!approveNewSession())return;clearSavedSession();baseStartExam();focusQuestion();};
const baseMakeSession=makeSession;
makeSession=function(mode,pool,len,title){if(!pool.length){toast('No questions match this practice filter');return;}if(!approveNewSession())return;clearSavedSession();baseMakeSession(mode,pool,len,title);focusQuestion();};
const baseSetLen=setLen;
setLen=function(n){baseSetLen(n);S.settings.sessionLength=LEN;save();};
LEN=[10,20,40].includes(S.settings.sessionLength)?S.settings.sessionLength:20;
function decorateSession(){
  document.body.classList.add('has-session');
  const app=document.getElementById('app'),it=sess.items[sess.idx];
  for(const b of app.querySelectorAll('.qcard .qbar button'))b.parentElement.classList.add('inline-actions');
  for(const [i,b] of [...app.querySelectorAll('.opts button')].entries()){
    if(sess.mode==='exam')b.setAttribute('aria-pressed',String(it.ans===it.opts[i]));
    else if(it.done)b.setAttribute('aria-disabled','true');
  }
  if(sess.mode==='exam'){
    const palette=app.querySelector('.palette');
    if(palette){
      const flagged=sess.items.filter(i=>i.flag).length,unanswered=sess.items.filter(i=>i.ans==null).length;
      const details=document.createElement('details');details.className='exam-map';details.open=!!sess.mapOpen;
      details.innerHTML=`<summary>Question navigator · ${flagged} flagged · ${unanswered} unanswered</summary><div class="row map-tools"><button class="btn gh sm" onclick="jumpExam('unanswered')">Next unanswered</button><button class="btn gh sm" onclick="jumpExam('flagged')">Next flagged</button></div><p class="small muted">✓ answered · ★ flagged · outlined = current</p>`;
      palette.before(details);details.append(palette);
      for(const [n,b] of [...palette.children].entries()){
        const x=sess.items[n];b.textContent=`${n+1}${x.flag?' ★':x.ans!=null?' ✓':''}`;
        b.setAttribute('aria-label',`Question ${n+1}, ${x.ans==null?'unanswered':'answered'}${x.flag?', flagged':''}`);
        if(n===sess.idx)b.setAttribute('aria-current','true');
      }
      details.addEventListener('toggle',()=>{if(sess?.live&&sess.mode==='exam'){sess.mapOpen=details.open;persistSession();}});
    }
  }
  const flash=app.querySelector('.flash');
  if(flash){flash.tabIndex=0;flash.setAttribute('role',it.flip?'group':'button');flash.setAttribute('aria-label',it.flip?'Flashcard answer':'Reveal flashcard answer');flash.onclick=e=>{if(!e.target.closest('a,button'))flashFlip();};}
  const dock=document.createElement('div');dock.className='session-dock';dock.setAttribute('role','region');dock.setAttribute('aria-label','Study session controls');
  if(sess.mode==='exam')dock.innerHTML=`<button class="btn gh" ${sess.idx===0?'disabled':''} onclick="examNav(-1)">Previous</button><button class="btn gh" ${sess.idx===sess.items.length-1?'disabled':''} onclick="examNav(1)">Next</button><button class="btn" onclick="confirmSubmit()">Submit exam</button>`;
  else if(sess.mode==='flash')dock.innerHTML=it.flip?`<button class="btn gh" onclick="flashRate(false)">Didn't know</button><button class="btn" onclick="flashRate(true)">Knew it</button>`:`<span class="small muted">Recall before revealing</span><button class="btn" onclick="flashFlip()">Reveal answer</button>`;
  else dock.innerHTML=`<span class="small muted">${it.done?(it.ans===byId(it.id).a?'Correct · read the explanation':'Incorrect · review the explanation'):'Choose an answer'}</span><button class="btn" ${it.done?'':'disabled'} onclick="nextOrEnd()">${sess.idx===sess.items.length-1?'Finish':'Next question'}</button>`;
  app.append(dock);persistSession();
}
const baseExamRun=examRun,baseDrillRun=drillRun,baseFlashRun=flashRun;
examRun=function(){baseExamRun();decorateSession();};
drillRun=function(){baseDrillRun();decorateSession();};
flashRun=function(){baseFlashRun();decorateSession();};
const baseNextOrEnd=nextOrEnd;
nextOrEnd=function(){baseNextOrEnd();if(sess.live)focusQuestion();};
const baseExamNav=examNav,baseExamGo=examGo;
examNav=function(d){baseExamNav(d);focusQuestion();};
examGo=function(n){baseExamGo(n);focusQuestion();};
function jumpExam(kind){
  for(let step=1;step<=sess.items.length;step++){
    const index=(sess.idx+step)%sess.items.length,it=sess.items[index];
    if(kind==='flagged'?it.flag:it.ans==null){examGo(index);return;}
  }
  toast(kind==='flagged'?'No flagged questions':'All questions answered');
}
const baseDrillPick=drillPick;
drillPick=function(i){if(sess.items[sess.idx].done)return;baseDrillPick(i);const it=sess.items[sess.idx];announce(it.ans===byId(it.id).a?'Correct. Explanation available below.':'Incorrect. Correct answer and explanation available below.');};
const baseSessionDone=sessionDone,baseSubmitExam=submitExam;
sessionDone=function(){clearSavedSession();document.body.classList.remove('has-session');baseSessionDone();};
submitExam=function(auto){if(!sess?.live)return;clearSavedSession();document.body.classList.remove('has-session');baseSubmitExam(auto);};
const baseReset=resetP;
resetP=function(){const before=S;baseReset();if(S!==before)clearSavedSession();};
function bankPageStep(delta){bankPage+=delta;renderBankRows();document.getElementById('bankRows').scrollIntoView({block:'start'});document.querySelector('#bankRows summary')?.focus({preventScroll:true});}
function clearBankSearch(){bankQuery='';bankPage=0;document.getElementById('bankSearch').value='';renderBankRows();document.getElementById('bankSearch').focus();}
const baseBankView=bankView;
bankView=function(){baseBankView();const clear=document.createElement('button');clear.className='btn gh sm';clear.textContent='Clear search';clear.onclick=clearBankSearch;document.querySelector('#app .card.row').append(clear);};
document.addEventListener('keydown',e=>{
  const target=e.target;
  if(target.matches?.('input,textarea,select')||target.isContentEditable||e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if((e.key==='Enter'||e.key===' ')&&target.matches?.('.trow[onclick],.card.click[onclick],.brand')){e.preventDefault();target.click();return;}
  if(!sess?.live)return;
  if(/^[1-9]$/.test(e.key)&&sess.mode!=='flash'){
    const i=Number(e.key)-1;if(i<sess.items[sess.idx].opts.length){e.preventDefault();sess.mode==='exam'?examPick(i):drillPick(i);}return;
  }
  if((e.key==='Enter'||e.key===' ')&&target.matches?.('button,summary,a'))return;
  if(sess.mode==='exam'){
    if(e.key==='ArrowRight'){e.preventDefault();examNav(1);}else if(e.key==='ArrowLeft'){e.preventDefault();examNav(-1);}else if(e.key.toLowerCase()==='f'){e.preventDefault();flagQ();}
  }else if(sess.mode==='flash'){
    if(e.key===' '||(e.key==='Enter'&&target.matches?.('.flash'))){e.preventDefault();flashFlip();}
    else if(sess.items[sess.idx].flip&&e.key==='ArrowRight'){e.preventDefault();flashRate(true);}else if(sess.items[sess.idx].flip&&e.key==='ArrowLeft'){e.preventDefault();flashRate(false);}
  }else if(sess.items[sess.idx].done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextOrEnd();}
});

const cardObserver=new MutationObserver(()=>{
  for(const el of document.querySelectorAll('.trow[onclick],.card.click[onclick],.brand')){el.tabIndex=0;el.setAttribute('role','button');}
});
cardObserver.observe(document.getElementById('app'),{childList:true,subtree:true});
document.querySelector('.brand').tabIndex=0;document.querySelector('.brand').setAttribute('role','button');
window.addEventListener('beforeunload',persistSession);

renderNav();dashboard();
